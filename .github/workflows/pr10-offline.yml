name: PR10 offline research contract (no OCR inference)

on:
  pull_request:
    branches:
      - main
      - feat/genuine-handwriting-validation
    paths:
      - "backend/evaluation/pr10_*.py"
      - "backend/tests/test_pr10_*.py"
      - "docs/validation/pr10_partition_manifest.json"
      - ".github/workflows/pr10-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr10-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_MODE: local
      ENABLE_LOCAL_AI: "false"
      ENABLE_EXTERNAL_EXPLAINER: "false"
      OLLAMA_HOST: http://127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Refuse private handwriting files
        run: |
          if git ls-files | grep -E '(^|/)(handwriting-private|real-handwriting|private-handwriting)/'; then
            echo "PRIVATE_HANDWRITING_SOURCE_FILES_TRACKED" >&2
            exit 1
          fi
      - name: Run PR10 partition and campaign contract tests
        run: |
          PYTHONPATH=backend python -m pytest -q \
            backend/tests/test_pr10_partition.py \
            backend/tests/test_pr10_campaign_rules.py
