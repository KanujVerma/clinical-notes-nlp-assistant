name: Hosted synthetic release gate (no deployment)

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/showcase/**"
      - "data/precomputed_scenarios.json"
      - "scripts/hosted_preflight.py"
      - "render.yaml"
      - "vercel.json"
      - ".github/workflows/hosted-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-synthetic-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-hosted-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: synthetic_qa
          POSTGRES_PASSWORD: synthetic_qa_disposable
          POSTGRES_DB: synthetic_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic_qa -d synthetic_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_MODE: hosted_demo
      DATABASE_URL: postgresql://synthetic_qa:synthetic_qa_disposable@127.0.0.1:5432/synthetic_qa
      DATABASE_SSLMODE: disable
      FRONTEND_URL: http://localhost:5173
      ENABLE_EXTERNAL_EXPLAINER: "false"
      ENABLE_LOCAL_AI: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install synthetic-only test runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils
          python -m pip install -r requirements.txt
          npm ci --prefix frontend
          cd frontend && npx playwright install --with-deps chromium
      - name: Apply migrations to disposable PostgreSQL test database
        run: |
          cd backend
          python -m alembic upgrade head
      - name: Read-only release preflight against migrated test schema
        run: python scripts/hosted_preflight.py --check-db
      - name: Real hosted Flask integration, no mocked routes
        run: python -m pytest backend/tests/test_hosted_release.py -q
      - name: Start actual hosted Flask and Vite servers
        run: |
          (cd backend && python app.py) >/tmp/hosted-flask-qa.log 2>&1 &
          (cd frontend && npm run dev -- --host 127.0.0.1) >/tmp/hosted-vite-qa.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/api/health/ready >/dev/null &&
               curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/hosted-flask-qa.log /tmp/hosted-vite-qa.log
          exit 1
      - name: Real hosted-mode Chromium integration
        env:
          CI: "true"
          RUN_REAL_HOSTED_E2E: "1"
        run: cd frontend && npx playwright test e2e/hosted-real.spec.ts --workers=1 --reporter=line
      - name: Upload safe failure reports only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-browser-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
